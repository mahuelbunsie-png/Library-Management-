name: Run Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Check that all tests pass and coverage is at least 90%
      - name: Run pytest
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90
