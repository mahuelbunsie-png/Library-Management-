
name: Run Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: library-management

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: python -m pytest tests --ignore=tests/e2e -v --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Start Flask server
        run: |
          nohup python run.py > /tmp/flask.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/flask.log
          exit 1

      - name: Run Playwright E2E tests
        run: python -m pytest tests/e2e -v
